[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "keyword-extraction-claim-audit"
version = "0.1.0"
description = "Offline documentation claim auditor"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
keyword-extraction-claim-audit = "keyword_extraction_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["keyword_extraction_claim_audit*"]
